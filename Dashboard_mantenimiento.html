<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<!-- Control de acceso VSPT — correos @vspt.com.ar y @vspt.cl (ver auth.js) -->
<script src="https://accounts.google.com/gsi/client" async></script>
<script src="auth.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- three.js para la pestaña Planta 3D: se importa recién al abrirla -->
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
<title>VSPT · Mantenimiento — Lubricación por horas de uso</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --vspt-deep-purple:#4E1742; --vspt-wine:#701F52; --vspt-plum:#301030;
    --vspt-crimson:#D81840; --vspt-beige:#E0D0B8; --vspt-olive:#98A040;
    --vspt-orange:#F08808; --vspt-yellow:#F8C040;
    --l1:#B04A82; --l2:#5DC7D1; --l3:#F08808; --sf:#8C6F84;
    --bg:#1A1915; --card:#222220; --card2:#2A2A28; --border:rgba(200,168,130,0.14);
    --text:#F3F1EB; --muted:#c9b8c4; --th-bg:#3a1f33; --tr-hover:rgba(216,24,64,0.06);
    --td-border:rgba(255,255,255,0.07);
    --ok:#B2BC52; --ok-bg:rgba(152,160,64,.2); --warn:#F8C040; --warn-bg:rgba(248,192,64,.16);
    --crit:#FF5A76; --crit-bg:rgba(216,24,64,.2); --na:#9c8f9a; --na-bg:rgba(156,143,154,.16);
    --accent:#C9609A; --accent-ink:#1A1915; --focus:#F8C040;
    --ramp-lo:#3B3137; --ramp-hi:#C9609A; --ok-ink:#1A1915; --crit-ink:#1A1915;
    --s-bg:#1A1915; --s-floor:#2C2A26; --s-floor-side:#1D1C19; --s-lines:#E0D0B8; --s-walls:#3D3934; --s-cols:#5E4A58;
    --s-body:#5A544C; --s-trim:#D8C8D2; --s-accent:#F8C040; --s-steel:#6C665E; --s-wood:#8C6F4A; --s-glass:#5E7F69; --s-card:#8A7152;
    --ramp-uso-lo:#3B3137; --ramp-uso-hi:#E88AC0;
    --s-ok:#1FE36A; --s-warn:#FFC81A; --s-crit:#FF2E48; --s-pend:#FF8A1F; --s-dark:#2B2927; --s-screen:#3FA9F5; --s-film:#E8EEF2; --s-inox:#AEB4BA; --s-inox2:#C4CAD0;
    --s-vacia:#3F9A4B; --s-frame:#2F3236; --s-handle:#F07A1A; --s-panel:#4B525C; --s-red:#C8202A; --s-blue:#2F6FD0; --s-white:#F2F1EC; --s-tape:#E6D6A8;
  }
  body.light{ --bg:#F3F1EB; --card:#fff; --card2:#FAF7F0; --border:rgba(78,23,66,0.14);
    --text:#301030; --muted:#7a627a; --th-bg:#F3F1EB; --tr-hover:rgba(78,23,66,0.05);
    --td-border:rgba(78,23,66,0.08); --l1:#701F52;
    --ok:#5E6620; --ok-bg:rgba(152,160,64,.18); --warn:#8A5C00; --warn-bg:rgba(248,192,64,.3);
    --crit:#B0122F; --crit-bg:rgba(216,24,64,.12); --na:#7A6E78; --na-bg:rgba(184,168,152,.25);
    --accent:#701F52; --accent-ink:#fff; --focus:#F08808; --ramp-lo:#F2E7EE; --ramp-hi:#701F52; --ok-ink:#fff; --crit-ink:#fff;
    --s-bg:#ECE6DC; --s-floor:#E3DCD0; --s-floor-side:#C9BDAC; --s-lines:#4E1742; --s-walls:#D4C8B6; --s-cols:#8C6F84;
    --s-body:#F6F1E8; --s-trim:#4E1742; --s-accent:#F8C040; --s-steel:#ADA59A; --s-wood:#C9A36E; --s-glass:#86A890; --s-card:#C7A57B;
    --ramp-uso-lo:#EFE3EA; --ramp-uso-hi:#701F52;
    --s-ok:#12C95A; --s-warn:#FFB800; --s-crit:#F0142F; --s-pend:#FF7A00; --s-dark:#3A3434; --s-screen:#2F8FE0; --s-film:#F4F7F9; --s-inox:#C8CDD2; --s-inox2:#D6DBDF;
    --s-vacia:#3F9A4B; --s-frame:#3A3D42; --s-handle:#F07A1A; --s-panel:#59616B; --s-red:#C8202A; --s-blue:#2F6FD0; --s-white:#F2F1EC; --s-tape:#E6D6A8; }
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none!important}
  body{background:var(--bg);color:var(--text);font-family:'Montserrat',system-ui,sans-serif;font-size:14px;line-height:1.45}
  button,input,select,textarea{font-family:inherit;font-size:13px;color:inherit}
  :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  .tnum{font-variant-numeric:tabular-nums}
  .muted{color:var(--muted)} .small{font-size:12px}
  .header{background:var(--vspt-plum);border-bottom:1px solid rgba(224,208,184,0.22);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
  body.light .header{background:var(--vspt-deep-purple)}
  .header-left{display:flex;align-items:center;gap:14px}
  .logo{width:44px;height:44px;background:#fff;border-radius:6px;display:flex;align-items:center;justify-content:center;padding:5px;overflow:hidden}
  .logo img{width:100%;height:100%;object-fit:contain}
  .header-title{font-size:20px;font-weight:700;color:#fff}
  .header-title span{color:var(--vspt-beige);font-weight:500}
  .header-sub{font-size:10px;color:var(--vspt-beige);margin-top:3px;text-transform:uppercase;letter-spacing:0.2em;font-weight:600}
  .header-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .status-badge{display:flex;align-items:center;gap:7px;color:var(--vspt-beige);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.14em}
  .status-dot{width:7px;height:7px;border-radius:50%;background:var(--vspt-yellow)}
  .status-badge.ok .status-dot{background:var(--vspt-olive)} .status-badge.err{color:#ff9db0} .status-badge.err .status-dot{background:var(--vspt-crimson)}
  .chip-ed{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;border:1px solid rgba(224,208,184,.4);color:#fff;border-radius:5px;padding:3px 7px}
  .btn-hdr{background:transparent;border:1px solid rgba(224,208,184,0.32);color:#fff;border-radius:6px;padding:7px 11px;cursor:pointer;font-size:12px}
  .btn-hdr:hover{background:var(--vspt-crimson);border-color:var(--vspt-crimson)}
  .tabs{display:flex;gap:2px;padding:0 20px;background:var(--card);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{background:none;border:0;border-bottom:3px solid transparent;padding:12px 14px 10px;font-weight:700;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
  .tab:hover{color:var(--text)}
  .tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--vspt-crimson)}
  .tab .n{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--crit-bg);color:var(--crit);font-size:10.5px}
  .content{padding:18px 22px 60px;display:grid;gap:16px;max-width:1500px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;display:grid;gap:10px;min-width:0}
  .card h2{font-size:15px;font-weight:800;letter-spacing:-.2px}
  .card .sub{font-size:12px;color:var(--muted);margin-top:-4px}
  .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .grow{flex:1}
  .btn{background:transparent;border:1px solid var(--border);color:var(--text);padding:7px 13px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:700;letter-spacing:.03em}
  .btn:hover{border-color:var(--vspt-crimson);color:var(--vspt-crimson)}
  .btn.primary{background:var(--vspt-crimson);border-color:var(--vspt-crimson);color:#fff}
  .btn.primary:hover{filter:brightness(1.08);color:#fff}
  .btn.accent{background:var(--vspt-wine);border-color:var(--vspt-wine);color:#fff}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  select,input[type=text],input[type=date],input[type=number],input[type=email],input[type=search]{background:var(--card2);color:var(--text);border:1px solid var(--border);border-radius:7px;padding:6px 9px}
  input[type=date]{color-scheme:dark} body.light input[type=date]{color-scheme:light}
  label.f{display:grid;gap:3px;align-content:start;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  label.f input,label.f select{font-size:13px;letter-spacing:0;text-transform:none;font-weight:500;color:var(--text)}
  .seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
  .seg button{background:none;border:0;padding:6px 11px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
  .chip{display:inline-flex;align-items:center;border-radius:5px;padding:1px 7px;font-size:11px;font-weight:800;letter-spacing:.04em}
  .chip.L1{background:var(--l1);color:#fff} .chip.L2{background:var(--l2);color:#0D2E32} .chip.L3{background:var(--l3);color:#1A1915} .chip.SF{background:var(--sf);color:#fff}
  .pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;white-space:nowrap}
  .pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
  .pill.vencido{background:var(--crit-bg);color:var(--crit)} .pill.proximo{background:var(--warn-bg);color:var(--warn)}
  .pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.sin_regla{background:var(--na-bg);color:var(--na)}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}
  .dot.vencido{background:var(--crit)} .dot.proximo{background:var(--warn)} .dot.ok{background:var(--ok)} .dot.sin_regla,.dot.na{background:var(--na)}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
  .kpi{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 14px;display:grid;gap:2px}
  .kpi .l{font-size:9.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .kpi .v{font-size:24px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
  .kpi .s{font-size:11px;color:var(--muted)}
  .kpi.crit .v{color:var(--crit)} .kpi.warn .v{color:var(--warn)}
  .tbl-wrap{overflow:auto;border:1px solid var(--border);border-radius:8px;max-height:70vh}
  table.tbl{border-collapse:collapse;width:100%;font-size:12.5px}
  .tbl th{position:sticky;top:0;z-index:1;background:var(--th-bg);text-align:left;font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:8px 9px;border-bottom:1px solid var(--border);white-space:nowrap}
  .tbl td{padding:7px 9px;border-bottom:1px solid var(--td-border);vertical-align:top}
  .tbl tr:hover td{background:var(--tr-hover)}
  .tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .nw{white-space:nowrap}
  .tbl tr.eqrow td{background:var(--card2);font-weight:700;font-size:12px}
  .tbl tr.done td{opacity:.55}
  .meter{height:6px;width:80px;background:var(--card2);border:1px solid var(--border);border-radius:3px;overflow:hidden;display:inline-block;vertical-align:middle}
  .meter i{display:block;height:100%}
  .meter i.vencido{background:var(--crit)} .meter i.proximo{background:var(--warn)} .meter i.ok{background:var(--ok)} .meter i.carga{background:var(--accent)}
  .hint{font-size:12px;color:var(--muted);background:var(--card2);border-radius:8px;padding:8px 11px}
  .warnbox{font-size:12px;border-left:3px solid var(--warn);background:var(--warn-bg);border-radius:0 7px 7px 0;padding:7px 11px}
  .errbox{font-size:13px;border-left:3px solid var(--crit);background:var(--crit-bg);border-radius:0 7px 7px 0;padding:10px 12px}
  .loading{padding:40px;text-align:center;color:var(--muted)}
  .btn.sm{padding:3px 9px;font-size:11px}
  /* OT */
  #formCarga .tbl-wrap{max-height:none}
  .form-top{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;align-items:end}
  .lotes{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px}
  .lotes label{display:grid;gap:3px;font-size:11px;font-weight:600;color:var(--muted)}
  .formbar{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--border);padding:10px 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
  .tbl select.st{min-width:108px}
  .tbl input[type=text]{width:100%;min-width:130px}
  /* calendario */
  table.cal{border-collapse:separate;border-spacing:4px;width:100%;min-width:760px}
  .cal th{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center;padding:3px}
  .cal th.rh{text-align:left}
  .cal button{width:100%;min-height:56px;border:1px solid var(--border);border-radius:8px;cursor:pointer;display:grid;place-content:center;font-variant-numeric:tabular-nums}
  .cal button b{font-size:17px;font-weight:800}
  .cal button span{font-size:10.5px;font-weight:600}
  .cal button[aria-pressed="true"]{outline:2px solid var(--focus);outline-offset:1px}
  /* equipos */
  .eqlayout{display:grid;grid-template-columns:minmax(260px,360px) minmax(0,1fr);gap:16px;align-items:start}
  @media (max-width:900px){.eqlayout{grid-template-columns:minmax(0,1fr)}}
  .tree{max-height:74vh;overflow:auto;display:grid;gap:2px}
  .tree details{border-radius:6px}
  .tree summary{cursor:pointer;padding:6px 8px;border-radius:6px;font-weight:700;font-size:12.5px;list-style:none;display:flex;gap:8px;align-items:center}
  .tree summary::-webkit-details-marker{display:none}
  .tree summary::before{content:"▸";color:var(--muted);font-size:11px}
  .tree details[open] > summary::before{content:"▾"}
  .tree .sec{margin-left:12px}
  .tree .eq{display:flex;gap:8px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:5px 8px 5px 26px;border-radius:6px;cursor:pointer;font-size:12.5px}
  .tree .eq:hover{background:var(--tr-hover)}
  .tree .eq[aria-current="true"]{background:var(--card2);outline:1px solid var(--border)}
  .tree .eq .c{margin-left:auto;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
  .fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
  .part{border:1px solid var(--border);border-radius:9px;overflow:hidden}
  .part > header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;background:var(--card2);font-weight:700;font-size:13px}
  .part > header .muted{font-weight:500;font-size:11.5px}
  .part .tbl-wrap{border:0;border-radius:0;max-height:none}
  .tbl input.cell,.tbl select.cell{width:100%;min-width:60px;padding:4px 6px;font-size:12px}
  .tbl td.n input.cell{width:78px;text-align:right}
  textarea.cell{width:100%;min-height:52px;resize:vertical;background:var(--card2);color:var(--text);border:1px solid var(--border);border-radius:7px;padding:6px 9px;font-size:13px;line-height:1.35}
  .tbl input.cell.dirty,.tbl select.cell.dirty,input.dirty,select.dirty,textarea.dirty{border-color:var(--vspt-orange);background:var(--warn-bg)}
  .tbl tr.editrow td{background:var(--card2)}
  .editgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;padding:4px 0}
  .editgrid .wide,.fields .wide{grid-column:1/-1}
  .otras .o{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 0;border-top:1px solid var(--td-border);font-size:12.5px}
  .rep{font-size:11.5px;color:var(--muted);padding:6px 12px;border-top:1px solid var(--td-border)}
  .savebar{position:sticky;bottom:10px;z-index:5;display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--vspt-orange);border-radius:10px;padding:10px 14px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
  /* carga desde el celular (QR) */
  .cg{display:grid;gap:10px;max-width:760px;width:100%;margin:0 auto}
  .cg-eq{font-weight:800;font-size:13.5px;padding:10px 2px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
  .cg-t{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;display:grid;gap:6px}
  .cg-t.done{opacity:.62}
  .cg-h{font-size:14px}
  .cg-bt{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:2px}
  .cg-bt button{min-height:48px;border-radius:9px;border:1.5px solid var(--border);background:var(--card2);font-weight:800;font-size:15px;color:var(--text);cursor:pointer}
  .cg-bt .cg-si[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--ok-ink)}
  .cg-bt .cg-no[aria-pressed="true"]{background:var(--crit);border-color:var(--crit);color:var(--crit-ink)}
  .cg details summary{cursor:pointer;font-size:12.5px;color:var(--muted);font-weight:600;padding:2px 0}
  .cg select,.cg input[type=text],.cg input[type=date],.cg textarea{width:100%;font-size:16px;min-height:42px}
  .cg textarea{background:var(--card2);color:var(--text);border:1px solid var(--border);border-radius:7px;padding:8px 10px;font-family:inherit}
  .meter.full{width:100%;height:8px;display:block}
  .val{display:inline-block;min-width:17px;padding:0 5px;border-radius:8px;background:var(--warn-bg);color:var(--warn);font-size:10.5px;font-weight:800;text-align:center}
  .btn[aria-pressed="true"]{background:var(--warn-bg);border-color:var(--warn);color:var(--text)}
  /* planta 3D */
  .p3{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
  @media (max-width:1000px){.p3{grid-template-columns:minmax(0,1fr)}}
  .p3-stage{position:relative;height:clamp(420px,68vh,780px);border-radius:10px;overflow:hidden;background:var(--s-bg);border:1px solid var(--border);touch-action:none}
  .p3-stage canvas{display:block;width:100%;height:100%}
  .p3-msg{position:absolute;inset:0;display:grid;place-content:center;text-align:center;color:var(--muted);padding:20px;font-size:13px}
  .p3-labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .mlabel{position:absolute;left:0;top:0;white-space:nowrap;display:flex;gap:5px;align-items:center;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:2px 7px;font-size:11px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.25)}
  .mlabel.sel{border-color:var(--focus)}
  .p3-legend{position:absolute;left:10px;bottom:10px;max-width:calc(100% - 20px);background:var(--card);border:1px solid var(--border);border-radius:8px;padding:7px 10px;display:grid;gap:4px;font-size:11.5px;opacity:.95}
  .p3-legend .items{display:flex;flex-wrap:wrap;gap:3px 12px}
  .p3-legend .ramp{height:8px;border-radius:4px;min-width:200px}
  .p3-edit{position:absolute;left:10px;right:56px;top:10px;z-index:3;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--vspt-orange);border-radius:9px;padding:7px 10px}
  .p3-stage.con-aviso .p3-edit{top:62px}
  .p3-aviso{position:absolute;left:10px;right:56px;top:10px;z-index:3;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--warn);border-radius:9px;padding:7px 10px;font-size:12px}
  .p3-stage canvas.p2{cursor:grab}
  .p3-full{position:absolute;top:10px;right:10px;z-index:4;width:36px;height:36px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25)}
  .p3-full:hover{border-color:var(--accent)}
  .p3-full svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  /* pantalla completa: la del navegador o, si no la permite (iPhone), la planta tapando la página */
  .p3.completa{position:fixed;inset:0;z-index:70;width:100%;height:100%;max-width:none;margin:0;padding:10px;overflow:auto;align-content:start;background:var(--bg)}
  .p3.completa .p3-hud{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .p3.completa .p3-hud > *{flex:none}

<body>
<div class="header">
  <div class="header-left">
    <div class="logo"><img src="assets/marca-secundaria.jpg" alt="VSPT" onerror="this.parentNode.style.display='none'"></div>
    <div>
      <div class="header-title">VSPT <span>· Mantenimiento</span></div>
      <div class="header-sub" id="hdrSub">Lubricación por horas de uso</div>
    </div>
  </div>
  <div class="header-right">
    <span class="chip-ed" id="chipEd" hidden>Editor del maestro</span>
    <div class="status-badge" id="status"><span class="status-dot"></span><span id="statusTxt">Cargando…</span></div>
    <button class="btn-hdr" id="btnReload" title="Volver a leer los datos">Actualizar</button>
    <button class="btn-hdr" id="btnTheme" hidden>Claro</button>
    <button class="btn-help" id="btnAyuda" type="button" aria-label="Ayuda: recorrido guiado" title="Ayuda · recorrido guiado" aria-haspopup="dialog" aria-expanded="false">?</button>
  </div>
</div>
<nav class="tabs" role="tablist" aria-label="Vistas">
  <button class="tab" role="tab" data-v="ot" aria-selected="true">OT semanal</button>
  <button class="tab" role="tab" data-v="indicadores" aria-selected="false">Indicadores</button>
  <button class="tab" role="tab" data-v="planta" aria-selected="false">Planta 3D</button>
  <button class="tab" role="tab" data-v="alertas" aria-selected="false">Alertas<span class="n" id="nVenc" hidden></span></button>
  <button class="tab" role="tab" data-v="calendario" aria-selected="false">Calendario</button>
  <button class="tab" role="tab" data-v="equipos" aria-selected="false">Equipos</button>
  <button class="tab" role="tab" data-v="avisos" aria-selected="false">Avisos SAP<span class="n" id="nAvisos" hidden></span></button>
  <button class="tab" role="tab" data-v="ajustes" aria-selected="false" id="tabAjustes" hidden>Ajustes</button>
</nav>
<main class="content" id="main"><div class="loading">Cargando el módulo de mantenimiento…</div></main>
<div class="toast" id="toast" hidden></div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbx8alYmoiwb5-z1nyvXfyCSLfELACGZ4qGGtIoS3j6lF1yS6SmFH0wYRbKfQPrq5P6N/exec";
const CACHE_KEY = 'vspt_mant_cache_v1';
// ?carga=OT-2026-40-L1 (lo abre el QR de la planilla impresa): la página funciona solo como formulario de carga.
const CARGA = (() => { try { const v = new URLSearchParams(location.search).get('carga'); return v && /^OT-\d{4}-\d{2}-(L\d|SF)$/.test(v) ? v : null; } catch (e) { return null; } })();
const TIMEOUT_MS = 120000;

let D = null;               // respuesta de ?tabla=mant
let IX = {};                // índices derivados
let view = 'ot';
let otSel = null, otLinea = null, otForm = false;
let alFil = { linea: 'all', est: new Set(['vencido', 'proximo']), q: '' };
let calSel = null;
let eqSel = null, eqQ = '';
let pend = [];              // cambios pendientes del editor [{tabla, op, id, campos}]
let CG = null, cgMarcas = {}, cgLub = '', cgFecha = '', cgLotes = {};   // formulario de carga (celular)
let eqVal = false;          // filtro de Equipos: solo los que tienen puntos por validar

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = (n, d = 0) => (n == null || n === '' || !isFinite(n)) ? '—' : Number(n).toLocaleString('es-AR', { minimumFractionDigits: d, maximumFractionDigits: d });
const MES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const pf = s => { const m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; };
const fday = s => { const d = typeof s === 'string' ? pf(s) : s; return d ? `${d.getDate()}-${MES[d.getMonth()]}` : '—'; };
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const cap = s => { s = String(s || '').trim().toLowerCase(); return s ? s[0].toUpperCase() + s.slice(1) : ''; };
const sinF = s => String(s || '').replace(/\s*F\s?\d{3,4}\s*$/, '').trim();
const si = v => ['SI', 'SÍ', 'TRUE', '1'].includes(String(v).trim().toUpperCase()) || v === true;
const EST = { vencido: 'Vencido', proximo: 'Próximo', ok: 'Al día', sin_regla: 'Sin regla' };
const RANK = { sin_regla: 0, ok: 1, proximo: 2, vencido: 3 };
const LINEAS = ['L1', 'L2', 'L3', 'SF'];
const RECORRIDO = ['DESP', 'ENJI', 'INER', 'LLEN', 'TAPA', 'ATAP', 'TROS', 'SECA', 'LEXT', 'CAPS', 'ETIQ', 'ENCA', 'ACAJ', 'CCAJ', 'ESTR', 'TRAN'];
const OPS = { LLENADO: ['LL', 'LLV'], VESTIDO: ['V', 'LLV'], SIEMPRE: ['LL', 'V', 'LLV'], 'SIN CONTADOR': [] };

function toast(msg, err) { const t = $('#toast'); t.textContent = msg; t.className = 'toast' + (err ? ' err' : ''); t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, err ? 7000 : 3800); }
function setStatus(txt, cls) { $('#statusTxt').textContent = txt; $('#status').className = 'status-badge ' + (cls || ''); }
const cacheGet = () => { try { return JSON.parse(localStorage.getItem(CACHE_KEY)); } catch (e) { return null; } };
const cacheSet = v => { try { localStorage.setItem(CACHE_KEY, JSON.stringify(v)); } catch (e) {} };

// ───────────── datos ─────────────
async function cargar() {
  if (CARGA) return abrirCarga(CARGA);
  setStatus('Cargando…');
  const c = cacheGet();
  if (c && c.data && !D) { D = c.data; indexar(); render(); setStatus('Datos guardados · actualizando…'); }
  try {
    const ctrl = new AbortController(); const to = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
    const r = await fetch(API_URL + '?tabla=mant', { signal: ctrl.signal }); clearTimeout(to);
    const j = await r.json();
    if (j.status !== 'success' || !j.mant) throw new Error(j.msg || j.reason || (j.status === 'success' ? 'la API todavía no tiene el módulo de mantenimiento (falta publicar la versión con 07_MANTENIMIENTO.gs)' : 'respuesta sin datos'));
    D = j.mant; cacheSet({ t: Date.now(), data: D }); indexar(); render();
    setStatus('Actualizado · uso al ' + fday(D.uso_hasta), 'ok');
  } catch (e) {
    const msg = e.name === 'AbortError' ? 'la API tardó más de 2 minutos' : e.message;
    setStatus('Sin conexión con la API', 'err');
    if (!D) $('#main').innerHTML = `<div class="errbox"><b>No se pudo cargar el módulo.</b> ${esc(msg)}<br><br><button class="btn" onclick="cargar()">Reintentar</button></div>`;
    else toast('No se pudo actualizar: ' + msg, true);
  }
}
async function post(body) {
  const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify(body), headers: { 'Content-Type': 'text/plain;charset=utf-8' } });
  const j = await r.json();
  if (j.status === 'error') throw new Error(j.msg || j.reason || 'error');
  return j;
}
function indexar() {
  IX = { eq: {}, parte: {}, pt: {}, partesEq: {}, ptsParte: {}, ptsEq: {}, regsOt: {}, rep: {}, otBases: [] };
  D.equipos.forEach(e => { e.equipo_sap = String(e.equipo_sap); IX.eq[e.equipo_sap] = e; IX.partesEq[e.equipo_sap] = []; IX.ptsEq[e.equipo_sap] = []; });
  D.partes.forEach(p => { p.parte_id = String(p.parte_id); p.equipo_sap = String(p.equipo_sap); IX.parte[p.parte_id] = p; (IX.partesEq[p.equipo_sap] = IX.partesEq[p.equipo_sap] || []).push(p); IX.ptsParte[p.parte_id] = []; });
  D.puntos.forEach(p => { p.punto_id = String(p.punto_id); p.parte_id = String(p.parte_id); p.equipo_sap = String(p.equipo_sap); IX.pt[p.punto_id] = p; (IX.ptsParte[p.parte_id] = IX.ptsParte[p.parte_id] || []).push(p); (IX.ptsEq[p.equipo_sap] = IX.ptsEq[p.equipo_sap] || []).push(p); });
  D.repuestos.forEach(r => { (IX.rep[String(r.parte_sap)] = IX.rep[String(r.parte_sap)] || []).push(r); });
  D.registros.forEach(r => { const k = String(r.ot_id || ''); if (!k) return; (IX.regsOt[k] = IX.regsOt[k] || {})[String(r.punto_id)] = r; });
  const bases = new Set(D.ots.map(f => String(f.ot_id).replace(/-(L\d|SF)$/, '')));
  IX.otBases = [...bases].sort().reverse();
  IX.activos = D.puntos.filter(p => si(p.activo_ok) || p.activo_ok === true);
  $('#chipEd').hidden = !D.editor; $('#tabAjustes').hidden = !D.editor;
  const venc = IX.activos.filter(p => p.estado === 'vencido').length;
  $('#nVenc').textContent = venc; $('#nVenc').hidden = !venc;
  const av = D.avisos.filter(a => a.estado === 'PENDIENTE').length;
  $('#nAvisos').textContent = av; $('#nAvisos').hidden = !av;
  $('#hdrSub').textContent = `Horas de uso OPINONA al ${fday(D.uso_hasta)} · contadores desde ${fday(D.arranque)}`;
}
const eqLinea = e => String(e.linea || '').toUpperCase();
const lineasEq = e => String(e.lineas_horas || e.linea || '').toUpperCase().split(/[,;\s]+/).filter(x => /^L[123]$/.test(x));
const opsEq = e => OPS[String(e.opera_en || 'SIEMPRE').toUpperCase().trim()] || OPS.SIEMPRE;
const ordenEq = e => { const k = RECORRIDO.indexOf(String(e.sector || '').toUpperCase()); return (k < 0 ? 99 : k); };
function nombreParte(p) { return p ? cap(sinF(p.nombre)) : '—'; }
function venceTxt(p) {
  if (p.estado === 'sin_regla') return 'sin regla de vencimiento';
  if (p.pct >= 1) {
    const ih = Number(p.intervalo_h) || 0, td = Number(p.tope_dias) || 0;
    if (ih && p.horas >= ih) return `vencido · +${fmt(p.horas - ih)} h`;
    if (td && p.dias >= td) return `vencido · +${fmt(p.dias - td)} d`;
    return 'vencido';
  }
  if (p.dias_hasta == null) return 'sin uso reciente';
  const d = new Date(pf(D.hoy).getTime() + p.dias_hasta * 864e5);
  return p.dias_hasta < 1 ? 'hoy' : `~${fmt(p.dias_hasta)} d · ${fday(d)}`;
}
const cantTxt = p => (p.cantidad !== '' && p.cantidad != null ? `${fmt(p.cantidad, Number(p.cantidad) % 1 ? 1 : 0)} ${p.unidad || ''}` : (p.unidad || '')).trim();

// ───────────── navegación ─────────────

// ── colores por capa, leyenda y resaltado ──

// ── puntero: elegir, arrastrar (modo Ubicar equipos) y acercar ──
function p3Tocar(ev) {
  const S = P3, r = S.renderer.domElement.getBoundingClientRect();
  S.ptr.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  S.ray.setFromCamera(S.ptr, S.cam);
  for (const h of S.ray.intersectObjects(S.picks, false)) { const id = h.object.userData.eqId, e = id && IX.eq[id]; if (e && p3Visible(e)) return id; }
  return null;
}
function p3Punteros() {
  const S = P3, T = S.T, el = S.renderer.domElement;

    abajo = [ev.clientX, ev.clientY];
    if (!p3.editar || ev.button > 0) return;
    const id = p3Tocar(ev), mc = id && S.maq.get(id), hit = new T.Vector3();
    if (!mc || !S.ray.ray.intersectPlane(S.piso, hit)) return;
    arrastre = { mc, off: hit.sub(mc.g.position), movio: false };
    S.controls.enabled = false; el.setPointerCapture(ev.pointerId); el.style.cursor = 'grabbing';
    p3Elegir(id);

  el.addEventListener('pointermove', ev => {
    if (arrastre) {

        const p = hit.sub(arrastre.off), q = v => Math.round(v * 20) / 20;   // pasos de 5 cm

      }

    if (ev.pointerType === 'touch') return;
    const id = p3Tocar(ev);
    if (id !== p3.hover) { p3.hover = id; el.style.cursor = id ? (p3.editar && S.maq.has(id) ? 'grab' : 'pointer') : ''; p3Resaltar(); }
  });
  el.addEventListener('pointerup', ev => {
    if (arrastre) { const { mc, movio } = arrastre; arrastre = null; S.controls.enabled = true; el.style.cursor = 'grab'; if (movio) p3Movido(mc); return; }
    if (!abajo || Math.hypot(ev.clientX - abajo[0], ev.clientY - abajo[1]) > 6) return;

}

function marcarCambio(el) {

function ayudaRoles() {

  T.card.className = 'tour-card rol';
  T.card.innerHTML = `<div class="tour-top"><span class="paso">Ayuda · recorrido guiado</span><button class="tour-x" data-tour="salir" aria-label="Cerrar la ayuda" title="Cerrar (Esc)">×</button></div>

      <b>${nom}${k === 'editor' && D && D.editor ? ' <span class="pill ok">tu cuenta</span>' : ''}</b><span class="d">${d}</span></button>`).join('')}</div>`;

function ayudaEmpezar(rol) {
  const T = TOUR; if (!T) return;

  T.rol = rol;
  if (!(rol === 'carga' ? CG : D)) return ayudaEsperar(rol);
  T.pasos = ayudaPasos(rol);
  T.vis = ayudaQuieto() ? null : { x: 0, y: 0, w: innerWidth, h: innerHeight };   // el foco se cierra sobre el primer paso
  ayudaIr(0, 1);
}
// Sin datos todavía (la API tarda): espera y arranca sola.
function ayudaEsperar(rol) {
  const T = TOUR; T.modo = 'espera'; T.els = [];
  const tarjeta = (t, x) => { T.card.className = 'tour-card'; T.card.innerHTML = `<div class="tour-top"><span class="paso">Ayuda · ${AYUDA_NOMBRE[rol]}</span><button class="tour-x" data-tour="salir" aria-label="Cerrar la ayuda">×</button></div><h3 id="tourT">${t}</h3><div class="tour-txt" id="tourX">${x}</div>`; T.vivo.textContent = t; };

  $('.tour-x', T.card).focus();

    if (TOUR !== T) return clearInterval(T.espera);
    if (rol === 'carga' ? CG : D) { clearInterval(T.espera); ayudaEmpezar(rol); }
    else if ($('#main .errbox')) { clearInterval(T.espera); tarjeta('No se pudieron leer los datos', 'Tocá Reintentar o Actualizar y, cuando cargue la página, abrí la ayuda de nuevo.'); $('.tour-x', T.card).focus(); }

  ayudaUbicar(dest && dest.w > 1 && dest.h > 1 ? dest : null, cw, ch, vw, vh);
}
// Cuatro paneles difuminados alrededor del hueco (arriba, abajo, izquierda, derecha): el hueco queda nítido
// sin depender de que el navegador recorte el difuminado con clip-path.
function ayudaHueco(r, vw, vh, p) {
  const T = TOUR, n = v => Math.round(Math.max(0, v) * 10) / 10, [a, b, c, d] = T.velos;
  const pon = (el, x, y, w, h) => { el.style.cssText = `left:${n(x)}px;top:${n(y)}px;width:${n(w)}px;height:${n(h)}px`; };
  if (!r) { pon(a, 0, 0, vw, vh); [b, c, d].forEach(el => pon(el, 0, 0, 0, 0)); T.aro.hidden = true; T.escudo.hidden = true; return; }
  const x = n(r.x), y = n(r.y), w = n(r.w), h = n(r.h);
  pon(a, 0, 0, vw, y); pon(b, 0, y + h, vw, vh - y - h); pon(c, 0, y, x, h); pon(d, x + w, y, vw - x - w, h);
  const caja = { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' };
  Object.assign(T.aro.style, caja); T.aro.hidden = false;
  Object.assign(T.escudo.style, caja, { pointerEvents: p && p.libre ? 'none' : 'auto' }); T.escudo.hidden = false;
}
// Tarjeta debajo, arriba o al costado de lo resaltado (al costado se angosta hasta 300 px); si no entra en
// ningún lado, lo tapa por el lado menos útil.
function ayudaUbicar(r, cw, ch, vw, vh) {
  const T = TOUR, M = 12, G = 14, W = 390, MIN = 300;
  let left, top, lado = 'centro', ancho = '';
  if (T.modo !== 'paso' || !r) { left = (vw - cw) / 2; top = Math.max(M, (vh - ch) / 2); }
  else {
    const abajo = vh - (r.y + r.h) - G - M, arriba = r.y - G - M, der = vw - (r.x + r.w) - G - M, izq = r.x - G - M;
    const cabe = { abajo: abajo >= ch, arriba: arriba >= ch, derecha: vw > 640 && der >= MIN, izquierda: vw > 640 && izq >= MIN };
    lado = cabe[T.lado] ? T.lado : ['abajo', 'arriba', 'derecha', 'izquierda'].find(k => cabe[k]) || 'encima';
    const cx = Math.min(Math.max(M, r.x + r.w / 2 - cw / 2), vw - cw - M), cy = Math.min(Math.max(M, r.y), vh - ch - M);
    if (lado === 'abajo') { left = cx; top = r.y + r.h + G; }
    else if (lado === 'arriba') { left = cx; top = r.y - G - ch; }
    else if (lado === 'derecha' || lado === 'izquierda') {
      const w = Math.min(W, lado === 'derecha' ? der : izq); ancho = w + 'px';
      left = lado === 'derecha' ? r.x + r.w + G : r.x - G - w; top = cy;
    }
    else { left = cx; top = abajo >= arriba ? vh - ch - M : M; }
  }
  T.lado = lado;
  if (T.card.style.width !== ancho) T.card.style.width = ancho;
  T.card.style.left = Math.round(Math.max(M, left)) + 'px'; T.card.style.top = Math.round(Math.max(M, top)) + 'px';
}
function ayudaTecla(e) {
  const T = TOUR; if (!T) return;
  if (e.key === 'Escape') { e.preventDefault(); ayudaCerrar(false); return; }
  if (T.modo === 'paso' && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) { e.preventDefault(); (e.key === 'ArrowRight' ? ayudaSig : ayudaAnt)(); return; }
  if (T.modo === 'roles' && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
    const bs = $$('[data-rol]:not([disabled])', T.card), i = bs.indexOf(document.activeElement);
    if (bs.length) { e.preventDefault(); bs[(i + (e.key === 'ArrowDown' ? 1 : -1) + bs.length) % bs.length].focus(); }
    return;
  }
  if (e.key === 'Tab') {   // el foco no sale de la tarjeta
    const f = $$('button:not([disabled]), a[href]', T.card); if (!f.length) return;
    const i = f.indexOf(document.activeElement); e.preventDefault();
    f[(i < 0 ? 0 : i + (e.shiftKey ? -1 : 1) + f.length) % f.length].focus();
  }
}
// fin = terminó el recorrido: vuelve a la pestaña donde se abrió la ayuda. Con Salir o Esc queda donde está.
function ayudaCerrar(fin) {
  const T = TOUR; if (!T) return;
  TOUR = null; cancelAnimationFrame(T.raf); clearInterval(T.espera);
  document.removeEventListener('keydown', ayudaTecla, true);
  T.root.hidden = true; T.card.innerHTML = ''; T.vivo.textContent = ''; T.velos.forEach(el => { el.style.cssText = ''; });
  $('#btnAyuda').setAttribute('aria-expanded', 'false');
  if (fin && T.rol !== 'carga' && T.vista0 !== view) { ayudaVista(T.vista0); scrollTo(0, 0); }
  (T.foco0 && T.foco0.isConnected && T.foco0 !== document.body ? T.foco0 : $('#btnAyuda')).focus({ preventScroll: true });
}

// ───────────── tema (lo decide el dashboard principal) ─────────────
function applyTheme(dark) { document.body.classList.toggle('light', !dark); $('#btnTheme').textContent = dark ? 'Claro' : 'Oscuro'; if (P3) p3Tema(); if (P2) p2Tema(); }
window.addEventListener('message', e => { if (e.data && e.data.type === 'vspt-theme') applyTheme(!!e.data.dark); });
if (window.self === window.top) { $('#btnTheme').hidden = false; $('#btnTheme').onclick = () => applyTheme(document.body.classList.contains('light')); }
$('#btnReload').onclick = () => (CG ? abrirCarga(CG.ot_id) : cargar());
$('#btnAyuda').onclick = ayudaAbrir;
// Tecla ? (fuera de los campos de texto): abre la ayuda.
document.addEventListener('keydown', e => {
  if (e.key !== '?' || TOUR || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.target.closest && e.target.closest('input, textarea, select, [contenteditable="true"]')) return;
  e.preventDefault(); ayudaAbrir();
});
if (CARGA) { $('.tabs').hidden = true; $('#hdrSub').textContent = 'Carga de lubricación desde el celular'; }
window.addEventListener('beforeunload', e => { if (pend.length || Object.keys(p3.mov).length) { e.preventDefault(); e.returnValue = ''; } });
(window.VSPT_API_READY || Promise.resolve()).then(cargar);
</script>
