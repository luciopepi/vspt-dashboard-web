<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<!-- Control de acceso VSPT — correos @vspt.com.ar y @vspt.cl (ver auth.js) -->
<script src="https://accounts.google.com/gsi/client" async></script>
<script src="auth.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- three.js para la planta: se importa recién al abrir la pestaña -->
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
<title>VSPT · Planta 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --vspt-deep-purple:#4E1742; --vspt-wine:#701F52; --vspt-plum:#301030;
    --vspt-crimson:#D81840; --vspt-beige:#E0D0B8; --vspt-olive:#98A040;
    --vspt-orange:#F08808; --vspt-yellow:#F8C040;
    --l1:#B04A82; --l2:#5DC7D1; --l3:#F08808; --sf:#8C6F84;
    --bg:#1A1915; --card:#222220; --card2:#2A2A28; --border:rgba(200,168,130,0.14);
    --text:#F3F1EB; --muted:#c9b8c4; --th-bg:#3a1f33; --tr-hover:rgba(216,24,64,0.06);
    --td-border:rgba(255,255,255,0.07);
    --ok:#B2BC52; --ok-bg:rgba(152,160,64,.2); --warn:#F8C040; --warn-bg:rgba(248,192,64,.16);
    --crit:#FF5A76; --crit-bg:rgba(216,24,64,.2); --na:#9c8f9a; --na-bg:rgba(156,143,154,.16);
    --accent:#C9609A; --accent-ink:#1A1915; --focus:#F8C040;
    --ramp-lo:#3B3137; --ramp-hi:#C9609A; --ok-ink:#1A1915; --crit-ink:#1A1915;
    --s-bg:#1A1915; --s-floor:#2C2A26; --s-floor-side:#1D1C19; --s-lines:#E0D0B8; --s-walls:#3D3934; --s-cols:#5E4A58;
    --s-body:#5A544C; --s-trim:#D8C8D2; --s-accent:#F8C040; --s-steel:#6C665E; --s-wood:#8C6F4A; --s-glass:#5E7F69; --s-card:#8A7152;
    --ramp-uso-lo:#3B3137; --ramp-uso-hi:#E88AC0;
    --s-ok:#1FE36A; --s-warn:#FFC81A; --s-crit:#FF2E48; --s-pend:#FF8A1F; --s-dark:#2B2927; --s-screen:#3FA9F5; --s-film:#E8EEF2; --s-inox:#AEB4BA; --s-inox2:#C4CAD0;
    --s-vacia:#3F9A4B; --s-frame:#2F3236; --s-handle:#F07A1A; --s-panel:#4B525C; --s-red:#C8202A; --s-blue:#2F6FD0; --s-white:#F2F1EC; --s-tape:#E6D6A8;
    --glass:rgba(30,29,27,.74); --glass2:rgba(255,255,255,.05); --glass-b:rgba(255,255,255,.10); --glass-sh:0 10px 30px rgba(0,0,0,.38);
    --z-ok:#1FE36A; --z-warn:#FFC81A; --z-crit:#FF2E48; --z-na:#9c8f9a;
  }
  body.light{ --bg:#F3F1EB; --card:#fff; --card2:#FAF7F0; --border:rgba(78,23,66,0.14);
    --text:#301030; --muted:#7a627a; --th-bg:#F3F1EB; --tr-hover:rgba(78,23,66,0.05);
    --td-border:rgba(78,23,66,0.08); --l1:#701F52;
    --ok:#5E6620; --ok-bg:rgba(152,160,64,.18); --warn:#8A5C00; --warn-bg:rgba(248,192,64,.3);
    --crit:#B0122F; --crit-bg:rgba(216,24,64,.12); --na:#7A6E78; --na-bg:rgba(184,168,152,.25);
    --accent:#701F52; --accent-ink:#fff; --focus:#F08808; --ramp-lo:#F2E7EE; --ramp-hi:#701F52; --ok-ink:#fff; --crit-ink:#fff;
    --s-bg:#ECE6DC; --s-floor:#E3DCD0; --s-floor-side:#C9BDAC; --s-lines:#4E1742; --s-walls:#D4C8B6; --s-cols:#8C6F84;
    --s-body:#F6F1E8; --s-trim:#4E1742; --s-accent:#F8C040; --s-steel:#ADA59A; --s-wood:#C9A36E; --s-glass:#86A890; --s-card:#C7A57B;
    --ramp-uso-lo:#EFE3EA; --ramp-uso-hi:#701F52;
    --s-ok:#12C95A; --s-warn:#FFB800; --s-crit:#F0142F; --s-pend:#FF7A00; --s-dark:#3A3434; --s-screen:#2F8FE0; --s-film:#F4F7F9; --s-inox:#C8CDD2; --s-inox2:#D6DBDF;
    --s-vacia:#3F9A4B; --s-frame:#3A3D42; --s-handle:#F07A1A; --s-panel:#59616B; --s-red:#C8202A; --s-blue:#2F6FD0; --s-white:#F2F1EC; --s-tape:#E6D6A8;
    --glass:rgba(255,255,255,.80); --glass2:rgba(78,23,66,.04); --glass-b:rgba(78,23,66,.10); --glass-sh:0 10px 28px rgba(48,16,48,.16);
    --z-ok:#12C95A; --z-warn:#F5A800; --z-crit:#F0142F; --z-na:#8C8088; }
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none!important}
  body{background:var(--bg);color:var(--text);font-family:'Montserrat',system-ui,sans-serif;font-size:14px;line-height:1.45}
  button,input,select,textarea{font-family:inherit;font-size:13px;color:inherit}
  :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  .tnum{font-variant-numeric:tabular-nums}
  .muted{color:var(--muted)} .small{font-size:12px}
  .header{background:var(--vspt-plum);border-bottom:1px solid rgba(224,208,184,0.22);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
  body.light .header{background:var(--vspt-deep-purple)}
  .header-left{display:flex;align-items:center;gap:14px}
  .logo{width:44px;height:44px;background:#fff;border-radius:6px;display:flex;align-items:center;justify-content:center;padding:5px;overflow:hidden}
  .logo img{width:100%;height:100%;object-fit:contain}
  .header-title{font-size:20px;font-weight:700;color:#fff}
  .header-title span{color:var(--vspt-beige);font-weight:500}
  .header-sub{font-size:10px;color:var(--vspt-beige);margin-top:3px;text-transform:uppercase;letter-spacing:0.2em;font-weight:600}
  .header-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .status-badge{display:flex;align-items:center;gap:7px;color:var(--vspt-beige);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.14em}
  .status-dot{width:7px;height:7px;border-radius:50%;background:var(--vspt-yellow)}
  .status-badge.ok .status-dot{background:var(--vspt-olive)} .status-badge.err{color:#ff9db0} .status-badge.err .status-dot{background:var(--vspt-crimson)}
  .chip-ed{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;border:1px solid rgba(224,208,184,.4);color:#fff;border-radius:5px;padding:3px 7px}
  .btn-hdr{background:transparent;border:1px solid rgba(224,208,184,0.32);color:#fff;border-radius:6px;padding:7px 11px;cursor:pointer;font-size:12px}
  .btn-hdr:hover{background:var(--vspt-crimson);border-color:var(--vspt-crimson)}
  .tabs{display:flex;gap:2px;padding:0 20px;background:var(--card);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{background:none;border:0;border-bottom:3px solid transparent;padding:12px 14px 10px;font-weight:700;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
  .tab:hover{color:var(--text)}
  .tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--vspt-crimson)}
  .tab .n{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--crit-bg);color:var(--crit);font-size:10.5px}
  .content{padding:18px 22px 60px;display:grid;gap:16px;max-width:1500px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;display:grid;gap:10px;min-width:0}
  .card h2{font-size:15px;font-weight:800;letter-spacing:-.2px}
  .card .sub{font-size:12px;color:var(--muted);margin-top:-4px}
  .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .grow{flex:1}
  .btn{background:transparent;border:1px solid var(--border);color:var(--text);padding:7px 13px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:700;letter-spacing:.03em}
  .btn:hover{border-color:var(--vspt-crimson);color:var(--vspt-crimson)}
  .btn.primary{background:var(--vspt-crimson);border-color:var(--vspt-crimson);color:#fff}
  .btn.primary:hover{filter:brightness(1.08);color:#fff}
  .btn.accent{background:var(--vspt-wine);border-color:var(--vspt-wine);color:#fff}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  select,input[type=text],input[type=date],input[type=number],input[type=email],input[type=search]{background:var(--card2);color:var(--text);border:1px solid var(--border);border-radius:7px;padding:6px 9px}
  input[type=date]{color-scheme:dark} body.light input[type=date]{color-scheme:light}
  label.f{display:grid;gap:3px;align-content:start;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  label.f input,label.f select{font-size:13px;letter-spacing:0;text-transform:none;font-weight:500;color:var(--text)}
  .seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
  .seg button{background:none;border:0;padding:6px 11px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
  .chip{display:inline-flex;align-items:center;border-radius:5px;padding:1px 7px;font-size:11px;font-weight:800;letter-spacing:.04em}
  .chip.L1{background:var(--l1);color:#fff} .chip.L2{background:var(--l2);color:#0D2E32} .chip.L3{background:var(--l3);color:#1A1915} .chip.SF{background:var(--sf);color:#fff}
  .pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;white-space:nowrap}
  .pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
  .pill.vencido{background:var(--crit-bg);color:var(--crit)} .pill.proximo{background:var(--warn-bg);color:var(--warn)}
  .pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.sin_regla{background:var(--na-bg);color:var(--na)}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}
  .dot.vencido{background:var(--crit)} .dot.proximo{background:var(--warn)} .dot.ok{background:var(--ok)} .dot.sin_regla,.dot.na{background:var(--na)}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
  .kpi{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 14px;display:grid;gap:2px}
  .kpi .l{font-size:9.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .kpi .v{font-size:24px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
  .kpi .s{font-size:11px;color:var(--muted)}
  .kpi.crit .v{color:var(--crit)} .kpi.warn .v{color:var(--warn)}
  .tbl-wrap{overflow:auto;border:1px solid var(--border);border-radius:8px;max-height:70vh}
  table.tbl{border-collapse:collapse;width:100%;font-size:12.5px}
  .tbl th{position:sticky;top:0;z-index:1;background:var(--th-bg);text-align:left;font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:8px 9px;border-bottom:1px solid var(--border);white-space:nowrap}
  .tbl td{padding:7px 9px;border-bottom:1px solid var(--td-border);vertical-align:top}
  .tbl tr:hover td{background:var(--tr-hover)}
  .tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .nw{white-space:nowrap}
  .tbl tr.eqrow td{background:var(--card2);font-weight:700;font-size:12px}
  .tbl tr.done td{opacity:.55}
  .meter{height:6px;width:80px;background:var(--card2);border:1px solid var(--border);border-radius:3px;overflow:hidden;display:inline-block;vertical-align:middle}
  .meter i{display:block;height:100%}
  .meter i.vencido{background:var(--crit)} .meter i.proximo{background:var(--warn)} .meter i.ok{background:var(--ok)} .meter i.carga{background:var(--accent)}
  .hint{font-size:12px;color:var(--muted);background:var(--card2);border-radius:8px;padding:8px 11px}
  .warnbox{font-size:12px;border-left:3px solid var(--warn);background:var(--warn-bg);border-radius:0 7px 7px 0;padding:7px 11px}
  .errbox{font-size:13px;border-left:3px solid var(--crit);background:var(--crit-bg);border-radius:0 7px 7px 0;padding:10px 12px}
  .loading{padding:40px;text-align:center;color:var(--muted)}
  .btn.sm{padding:3px 9px;font-size:11px}
  /* planta 3D */
  .p3{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
  @media (max-width:1000px){.p3{grid-template-columns:minmax(0,1fr)}}
  .p3-stage{position:relative;height:clamp(420px,68vh,780px);border-radius:10px;overflow:hidden;background:var(--s-bg);border:1px solid var(--border);touch-action:none}
  .p3-stage canvas{display:block;width:100%;height:100%}
  .p3-msg{position:absolute;inset:0;display:grid;place-content:center;text-align:center;color:var(--muted);padding:20px;font-size:13px}
  .p3-labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .mlabel{position:absolute;left:0;top:0;white-space:nowrap;display:flex;gap:5px;align-items:center;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:2px 7px;font-size:11px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.25)}
  .mlabel.sel{border-color:var(--focus)}
  .p3-legend{position:absolute;left:10px;bottom:10px;max-width:calc(100% - 20px);background:var(--card);border:1px solid var(--border);border-radius:8px;padding:7px 10px;display:grid;gap:4px;font-size:11.5px;opacity:.95}
  .p3-legend .items{display:flex;flex-wrap:wrap;gap:3px 12px}
  .p3-legend .ramp{height:8px;border-radius:4px;min-width:200px}
  .p3-edit{position:absolute;left:10px;right:56px;top:10px;z-index:3;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--vspt-orange);border-radius:9px;padding:7px 10px}
  .p3-stage.con-aviso .p3-edit{top:62px}
  .p3-aviso{position:absolute;left:10px;right:56px;top:10px;z-index:3;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--warn);border-radius:9px;padding:7px 10px;font-size:12px}
  .p3-stage canvas.p2{cursor:grab}
  .p3-full{position:absolute;top:10px;right:10px;z-index:4;width:36px;height:36px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25)}
  .p3-full:hover{border-color:var(--accent)}
  .p3-full svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  /* pantalla completa: la del navegador o, si no la permite (iPhone), la planta tapando la página */
  .p3-side{position:sticky;top:10px;max-height:calc(100vh - 20px);overflow:auto}
  .p3-list{display:grid;gap:2px}
  .p3-item{display:flex;gap:8px;align-items:center;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:7px;padding:6px 8px;cursor:pointer;font-size:12.5px;color:var(--text)}
  .p3-item:hover{background:var(--tr-hover);border-color:var(--border)}
  .p3-pts{display:grid}
  .p3-pt{border-top:1px solid var(--td-border);padding:7px 0;display:grid;gap:3px;font-size:12.5px}
  .dot.pend{background:var(--vspt-orange)}
  .dot.l1{background:var(--l1)} .dot.l2{background:var(--l2)} .dot.l3{background:var(--l3)} .dot.sf{background:var(--sf)}
  .p3 .dot.vencido{background:var(--s-crit)} .p3 .dot.proximo{background:var(--s-warn)} .p3 .dot.ok{background:var(--s-ok)} .p3 .dot.pend{background:var(--s-pend)}
  .p3 .dot.vencido{box-shadow:0 0 6px var(--s-crit)} .p3 .dot.proximo{box-shadow:0 0 6px var(--s-warn)} .p3 .dot.ok{box-shadow:0 0 6px var(--s-ok)} .p3 .dot.pend{box-shadow:0 0 6px var(--s-pend)}
  @media (max-width:640px){.p3-legend{font-size:10.5px;padding:5px 8px;left:6px;bottom:6px}.p3-stage{height:clamp(380px,62vh,640px)}}
  /* Planta 3D del tablero: etiqueta de cada línea (capa OPINONA), tarjetas por línea y fallas del equipo */
  .content{max-width:none;grid-template-columns:minmax(0,1fr)}   /* la planta nunca más ancha que la pantalla */
  .mlabel.lin{font-size:12.5px;padding:3px 9px;gap:6px;border-width:1.5px}
  .mlabel.lin b{font-size:13.5px}
  @media (max-width:640px){.mlabel.lin .muted{display:none}}   /* en el celular, sin la meta (está en el panel) */
  .p3-lins{display:grid;gap:8px}
  .p3-lin{display:grid;gap:3px;width:100%;text-align:left;background:var(--card2);color:var(--text);border:1px solid var(--border);border-radius:9px;padding:8px 11px;cursor:pointer;font-size:12px}
  .p3-lin:hover{border-color:var(--accent)}
  .p3-lin[aria-pressed="true"]{border-color:var(--focus)}
  .p3-lin .v{font-size:24px;font-weight:800;letter-spacing:-.5px;line-height:1.15;font-variant-numeric:tabular-nums}
  .p3-lin .v.ok{color:var(--ok)} .p3-lin .v.vencido{color:var(--crit)}
  .p3-fls{display:grid}
  .p3-fl{border-top:1px solid var(--td-border);padding:6px 0;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:1px 8px;align-items:baseline;font-size:12.5px}
  .p3-fl .dot{align-self:center}
  .p3-fl .obs{grid-column:2 / -1;color:var(--muted);font-size:11.5px}
  .p3-sec{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding-top:4px}
  /* dentro del tablero: sin encabezado propio (el del tablero ya está); la fecha de los datos va en la barra */
  body.embebida .header{display:none}
  .p3-pie{gap:4px 12px}
  /* cinco capas no entran en un celular: cada grupo de botones se desplaza adentro de la barra, sin correr la página */
  .p3-card{grid-template-columns:minmax(0,1fr)}
  .p3-hud .seg{max-width:100%;min-width:0;overflow-x:auto;scrollbar-width:none}
  .p3-hud .seg::-webkit-scrollbar{display:none}
  .p3-hud .seg button{white-space:nowrap;flex:none}
  body.embebida .content{padding-top:10px}
  /* ── Planta 3D v2 (oct-2026): el plano ocupa todo el cuadro y la información flota encima en tarjetas ── */
  .glass{background:var(--glass);border:1px solid var(--glass-b);border-radius:14px;box-shadow:var(--glass-sh);backdrop-filter:blur(14px) saturate(1.25);-webkit-backdrop-filter:blur(14px) saturate(1.25)}
  .p3{position:relative;display:block;height:calc(100vh - 110px);min-height:540px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--s-bg)}
  body.embebida .content{padding:0}
  body.embebida .p3{height:100vh;height:100dvh;border:0;border-radius:0}
  .p3 .p3-stage{position:absolute;inset:0;z-index:1;height:auto;border:0;border-radius:0}
  .p3-labels.modo *{pointer-events:none!important}
  .p3-ui{position:absolute;inset:0;z-index:2;pointer-events:none;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto minmax(0,1fr) auto;gap:10px;padding:12px}
  .p3-ui > *{pointer-events:auto;min-width:0}
  .p3-top{grid-column:1 / -1;display:flex;align-items:center;gap:8px;padding:6px 8px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .p3-top::-webkit-scrollbar{display:none}
  .p3-top > *{flex:none}
  .p3-top .seg{border-color:var(--glass-b);background:var(--glass2)}
  .p3-top .seg button{white-space:nowrap;padding:6px 10px}
  .p3-top .btn{border-color:var(--glass-b);background:var(--glass2)}
  .p3-top .ttl{display:flex;align-items:center;gap:8px;padding:0 6px 0 2px;font-weight:800;font-size:13px;letter-spacing:-.2px}
  .p3-top .ttl i{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--vspt-wine);color:#fff;font-style:normal}

<body>
<div class="header">
  <div class="header-left">
    <div class="logo"><img src="assets/marca-secundaria.jpg" alt="VSPT" onerror="this.parentNode.style.display='none'"></div>
    <div>
      <div class="header-title">VSPT <span>· Planta 3D</span></div>
      <div class="header-sub" id="hdrSub">OPINONA, fallas, limpieza, zonas 5S y tarjetas sobre el plano</div>
    </div>
  </div>
  <div class="header-right">
    <div class="status-badge" id="status"><span class="status-dot"></span><span id="statusTxt">Cargando…</span></div>
    <button class="btn-hdr" id="btnReload" title="Volver a leer los datos de Mantenimiento">Actualizar</button>
    <button class="btn-hdr" id="btnTheme" hidden>Claro</button>
  </div>
</div>
<main class="content" id="main"><div class="loading">Cargando la planta…</div></main>
<div class="toast" id="toast" hidden></div>
<script>
/* Planta 3D (oct-2026): el plano de Mantenimiento como tablero de la planta. Por ahora sólo en el
   tablero servido por Google (la pestaña la agrega 09_TABLERO_GOOGLE.gs, antes de "Planta").
   Capas: OPINONA por línea, fallas por equipo (Pareto), limpieza (OTIF por zona 5S), zonas 5S con sus
   responsables, tarjetas 5S (FDC), lubricación, OT de la semana y horas de uso.
   Diseño (v5, 5-oct): el plano ocupa todo el cuadro y la información flota encima en tarjetas.
   - Limpieza, zonas y tarjetas: ?tabla=planta3d, planta3d_otif, planta3d_tarjetas y planta3d_fotos
     (10_PLANTA3D.gs), recién al elegir una de esas capas. Nombres y fotos llegan sólo por la API.
   - Equipos, posiciones y puntos: ?tabla=mant, a demanda al abrir la pestaña (con la misma memoria del
     navegador que Mantenimiento, vspt_mant_cache_v1). No es un pedido nuevo de la API.
   - OPINONA: la que ya bajó el tablero (window.parent.VSPT_OPINONA, como Programas) y las funciones de
     v15 (procesarMetricas, getClasif1/2): el OPI de cada línea es el de sus pestañas. Nada se pide de nuevo.
   - El motor 3D/2D es una copia del de Dashboard_mantenimiento.html (sep-2026): mientras la Planta 3D sea
     sólo de Google conviven los dos; al pasarla a Netlify se saca la de Mantenimiento. */
const API_URL = "https://script.google.com/macros/s/AKfycbx8alYmoiwb5-z1nyvXfyCSLfELACGZ4qGGtIoS3j6lF1yS6SmFH0wYRbKfQPrq5P6N/exec";
const CACHE_KEY = 'vspt_mant_cache_v1';   // la misma que Mantenimiento: abre con lo último que se vio
const ESTADO_KEY = 'vspt_p3h_v1';         // capa, período y filtro de fallas elegidos
const TIMEOUT_MS = 120000;

let D = null;               // respuesta de ?tabla=mant
let IX = {};                // índices derivados
const view = 'planta', CG = null;   // el motor copiado de Mantenimiento pregunta por la vista y por la carga del celular
const otSel = null;         // OT de la semana: la de la semana en curso

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = (n, d = 0) => (n == null || n === '' || !isFinite(n)) ? '—' : Number(n).toLocaleString('es-AR', { minimumFractionDigits: d, maximumFractionDigits: d });
const MES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const MES_LARGO = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const pf = s => { const m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; };
const fday = s => { const d = typeof s === 'string' ? pf(s) : s; return d ? `${d.getDate()}-${MES[d.getMonth()]}` : '—'; };
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const cap = s => { s = String(s || '').trim().toLowerCase(); return s ? s[0].toUpperCase() + s.slice(1) : ''; };
const sinF = s => String(s || '').replace(/\s*F\s?\d{3,4}\s*$/, '').trim();
const si = v => ['SI', 'SÍ', 'TRUE', '1'].includes(String(v).trim().toUpperCase()) || v === true;
const fmtH = h => h >= 1 ? `${fmt(h, 1)} h` : `${fmt(h * 60)} min`;
const EST = { vencido: 'Vencido', proximo: 'Próximo', ok: 'Al día', sin_regla: 'Sin regla' };
const RANK = { sin_regla: 0, ok: 1, proximo: 2, vencido: 3 };
const LINEAS = ['L1', 'L2', 'L3', 'SF'];
const RECORRIDO = ['DESP', 'ENJI', 'INER', 'LLEN', 'TAPA', 'ATAP', 'TROS', 'SECA', 'LEXT', 'CAPS', 'ETIQ', 'ENCA', 'ACAJ', 'CCAJ', 'ESTR', 'TRAN'];

function toast(msg, err) { const t = $('#toast'); t.textContent = msg; t.className = 'toast' + (err ? ' err' : ''); t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, err ? 7000 : 3800); }
let estadoActual = '';
function setStatus(txt, cls) { estadoActual = txt; $('#statusTxt').textContent = txt; $('#status').className = 'status-badge ' + (cls || ''); const e = $('#p3estado'); if (e) e.textContent = txt; }
// Dentro del tablero (pestaña Planta 3D) no lleva encabezado propio.
const EMBEBIDA = (() => { try { return window.parent !== window; } catch (e) { return true; } })();
if (EMBEBIDA) document.body.classList.add('embebida');
const cacheGet = () => { try { return JSON.parse(localStorage.getItem(CACHE_KEY)); } catch (e) { return null; } };
const cacheSet = v => { try { localStorage.setItem(CACHE_KEY, JSON.stringify(v)); } catch (e) {} };

// ───────────── datos de Mantenimiento ─────────────
// Google a veces pierde la respuesta aunque el script contestó bien (la redirección "echo" termina en 404
// con una página HTML): se reintenta con espera creciente. Un JSON de error no se reintenta; un POST, nunca.
async function pedirApi(params, etiqueta) {
  const q = Object.entries(params).map(([k, v]) => k + '=' + encodeURIComponent(v)).join('&');
  const esperas = [1500, 4000, 9000];
  let error;
  for (let i = 0; i <= esperas.length; i++) {
    if (i) await new Promise(r => setTimeout(r, esperas[i - 1]));
    const ctrl = new AbortController(); const to = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
    try {
      const r = await fetch(API_URL + '?' + q, { signal: ctrl.signal });
      const texto = await r.text(); clearTimeout(to);
      try { return JSON.parse(texto); } catch (e) { error = new Error('la API no devolvió datos (HTTP ' + r.status + ')'); }
    } catch (e) { clearTimeout(to); error = e; if (e.name === 'AbortError') break; }
    console.warn('[API] intento ' + (i + 1) + ' sin datos · ' + (etiqueta || params.tabla) + ' · ' + error.message);
  }
  throw error;
}
const pedirMant = () => pedirApi({ tabla: 'mant' });
async function cargar() {
  setStatus('Cargando…');
  const c = cacheGet();
  if (c && c.data && !D) { D = c.data; indexar(); render(); setStatus('Datos guardados · actualizando…'); }
  try {
    const j = await pedirMant();
    if (j.status !== 'success' || !j.mant) throw new Error(j.msg || j.reason || 'la API no trajo los datos de Mantenimiento');
    D = j.mant; cacheSet({ t: Date.now(), data: D }); indexar(); render();
    setStatus(estadoTxt(), 'ok');
  } catch (e) {
    const msg = e.name === 'AbortError' ? 'la API tardó más de 2 minutos' : e.message;
    setStatus('Sin conexión con la API', 'err');
    if (D) { toast('No se pudo actualizar: ' + msg, true); return; }
    $('#main').innerHTML = `<div class="errbox"><b>No se pudo cargar la planta.</b> ${esc(msg)}<br><br><button class="btn" id="btnRe">Reintentar</button></div>`;
    $('#btnRe').onclick = cargar;
  }
}
async function post(body) {

// Rectángulo de una zona: el que dibujó un editor o, si no, el que encierra sus equipos ubicados (los de su línea

// 8 m) está mal ubicado y no estira la zona (p. ej. la secadora de L2 en la otra punta de la planta).
function p5RectDeEquipos(z) {

  const linea = D.equipos.filter(e => eqLinea(e) === z.linea && si(e.activo) && !P3_CINTAS[String(e.equipo_sap)])
    .map(e => ({ e, p: p3Pos(e) })).filter(o => o.p && !p3EnEspera(o.p));
  const cintas = Object.keys(P3_CINTAS).filter(id => IX.eq[id] && eqLinea(IX.eq[id]) === z.linea).flatMap(id => P3_CINTAS[id]);
  const junto = o => cintas.some(pl => pl.slice(1).some((q, i) => p2Dist(o.p.x, o.p.y, pl[i], q) <= 4))
    || linea.some(q => q !== o && Math.hypot(q.p.x - o.p.x, q.p.y - o.p.y) <= 8);

    <div class="resp">${z.responsables.map(n => `<div class="p">${p5Av(n, true, ed)}<span>${esc(n)}</span></div>`).join('') || '<span class="small muted">Sin responsables cargados.</span>'}</div>
    ${ed ? '<div class="small muted">Tocá una cara para cambiar la foto (como la de perfil).</div>' : ''}
    <div class="p3-sec">Limpieza · ${esc(p5MesTxt(mes))}${p5EnCurso(mes) ? ' (en curso)' : ''}</div>
    ${M ? `<div class="p3-trio"><div><span>%OTIF</span><b>${fmt(M.otif * 100)} %</b></div><div><span>%OT</span><b>${fmt(M.ot * 100)} %</b></div><div><span>%IF</span><b>${fmt(M.if * 100)} %</b></div></div>
      <div class="p3-prog" title="Meta ${fmt(p5Meta() * 100)} %"><i class="bar ${tono}" style="width:${Math.min(100, M.otif * 100)}%"></i></div>
      <div class="small muted">${M.hechas} de ${M.tgt || M.reg} tareas hechas (${M.fuera} fuera de estándar) · auditoría: ${M.aud_ok} de ${M.aud} puntos bien${M.reg === 0 ? ' · <b>sin registros semanales cargados</b>' : ''}</div>
      ${p5MesesZona(Z)}${p5TablaMarcas(Z, M)}`
      : `<div class="small muted">${P5.otif ? 'Sin datos de limpieza de la zona en ' + esc(p5MesTxt(mes)) + '.' : esc(p5Aviso('otif'))}</div>${Z ? p5MesesZona(Z) : ''}`}
    <div class="p3-sec">Tarjetas 5S de la zona</div>
    ${P5.tarj ? `<div class="small">${ts.length} tarjeta${ts.length === 1 ? '' : 's'} · ${ts.filter(t => t.fdc).length} FDC · ${abiertas.length} abierta${abiertas.length === 1 ? '' : 's'}</div>${abiertas.slice(0, 6).map(p5HtmlTarjeta).join('')}` : `<div class="small muted">${esc(p5Aviso('tarj'))}</div>`}
    ${ed ? `<div class="row"><button class="btn sm" id="p5Dib">${z.origen === 'editor' ? 'Volver a dibujar' : 'Dibujar a mano'}</button>${z.origen === 'editor' ? '<button class="btn sm" id="p5DibQ">Usar la de los equipos</button>' : ''}</div>` : ''}
    <div class="row">${z.rect ? '<button class="btn sm" id="p5Cen">Centrar</button>' : ''}<button class="btn sm" id="p5Cerrar">Cerrar</button></div>`;
  $$('[data-p5mes]', el).forEach(b => b.onclick = () => { p3.mes = b.dataset.p5mes; guardarEstado(); p5Refrescar(); });
  $$('[data-foto]', el).forEach(b => b.onclick = () => p5ElegirFoto(b.dataset.foto));
  p5BotonesTarjetas(el);
  const bd = $('#p5Dib', el); if (bd) bd.onclick = () => { p3.dibujo = { zona: z.zona, p0: null }; p3.ubicar = null; p5Modo(); };
  const bq = $('#p5DibQ', el); if (bq) bq.onclick = () => p5GuardarZona(z.zona, { rect: null });
  const bc = $('#p5Cen', el); if (bc) bc.onclick = () => p5EnfocarZona(z.zona);
  $('#p5Cerrar', el).onclick = () => { p5ElegirZona(null); p3Inicio(); };
  p5CargarFotos(z.responsables);
}
function p5Panel(el) {
  if (p3.zsel) { const z = p5Zona(p3.zsel); if (z) return p5PanelZona(el, z); p3.zsel = null; }
  if (p3.tsel) {
    const g = p5Pin(p3.tsel);
    if (g) {
      el.innerHTML = `<div class="row"><span class="tag">Tarjetas 5S · ${g.ts.length} en este lugar</span></div>
        <h2>${esc(g.ts[0].pos.origen === 'marca' ? 'Marcadas en el plano' : g.ts[0].pos.donde)}</h2><div class="sub">${g.fdc} FDC · ${g.abiertas} abierta${g.abiertas === 1 ? '' : 's'}</div>
        ${g.ts.slice().sort((a, b) => (a.estado === 'cerrada') - (b.estado === 'cerrada') || String(b.inicio).localeCompare(String(a.inicio))).map(p5HtmlTarjeta).join('')}
        <div class="row"><button class="btn sm" id="p5Cerrar">Cerrar</button></div>`;
      p5BotonesTarjetas(el); $('#p5Cerrar', el).onclick = () => { p5ElegirPin(null); p3Inicio(); };
      return;
    }
    p3.tsel = null;
  }
  if (p3.capa === 'tarjetas') {
    if (!P5.tarj) { el.innerHTML = `<h2>Tarjetas 5S</h2><div class="hint">${esc(p5Aviso('tarj'))}</div>`; return; }
    const ts = p5Ubicadas().filter(p5TarjVisible), abiertas = ts.filter(t => t.estado !== 'cerrada'), sinPos = ts.filter(t => !t.pos);
    el.innerHTML = `<div class="row"><span class="tag">Tarjetas 5S · Envasado</span></div><h2>${abiertas.length ? 'Tarjetas abiertas' : 'Tarjetas'}</h2>
      <div class="sub">${esc((P5.tarj.origen && P5.tarj.origen.nombre) || '')} · leída el ${fday((P5.tarj.generada || '').slice(0, 10))}</div>
      ${abiertas.length ? abiertas.map(p5HtmlTarjeta).join('') : '<div class="small muted">No hay tarjetas abiertas.</div>'}
      ${sinPos.length ? `<div class="p3-sec">Sin ubicar en el plano (${sinPos.length})</div><div class="small muted">El problema no dice el equipo y la línea. Ubicalas tocando "Ubicar".</div>${sinPos.slice(0, 12).map(p5HtmlTarjeta).join('')}${sinPos.length > 12 ? `<div class="small muted">y ${sinPos.length - 12} más</div>` : ''}` : ''}
      <div class="small muted">Tocá un pin para ver sus tarjetas.</div>`;
    p5BotonesTarjetas(el);
    return;
  }
  const zs = p5Zonas().filter(p5ZonaVisible);
  if (!zs.length) { el.innerHTML = `<h2>${p3.capa === 'limpieza' ? 'Limpieza por zona' : 'Zonas 5S'}</h2><div class="hint">${esc(p5Aviso('base') || 'Sin zonas.')}</div>`; return; }
  if (p3.capa === 'limpieza') {
    const mes = p5Mes(), filas = zs.map(z => ({ z, M: p5Otif(z.zona, mes) })).sort((a, b) => (a.M ? a.M.otif : 2) - (b.M ? b.M.otif : 2));
    el.innerHTML = `<div class="row"><span class="tag">Limpieza · ${esc(p5MesTxt(mes))}</span></div><h2>Zonas por OTIF</h2><div class="sub">De la más baja a la más alta · meta ${fmt(p5Meta() * 100)} %</div>
      <div class="p3-list">${filas.map(({ z, M }) => `<button class="p3-item" data-p5z="${esc(z.zona)}"><span class="dot ${M ? p5Tono(M.otif) : 'na'}"></span><span class="grow"><b>${esc(z.zona)}</b> ${esc(z.nombre)}</span><span class="small nw tnum">${M ? fmt(M.otif * 100) + ' %' : '—'}</span></button>`).join('')}</div>
      <div class="small muted">Tocá una zona para ver sus puntos de limpieza semana por semana.</div>`;
  } else {
    el.innerHTML = `<div class="row"><span class="tag">Zonas 5S · Envasado</span></div><h2>Responsables por zona</h2><div class="sub">Tocá una zona para ver a su equipo, su limpieza y sus tarjetas.</div>
      <div class="p3-list">${zs.map(z => `<button class="p3-item" data-p5z="${esc(z.zona)}"><span class="chip ${esc(z.linea || 'SF')}">${esc(z.zona)}</span><span class="grow">${esc(z.nombre)}</span>${p5Avs(z.responsables, 4)}</button>`).join('')}</div>`;
    p5CargarFotos(zs.flatMap(z => z.responsables));
  }
  $$('[data-p5z]', el).forEach(b => b.onclick = () => { p5ElegirZona(b.dataset.p5z); p5EnfocarZona(b.dataset.p5z); });
}

// ── cámara: encuadrar en lo que dejan libre las tarjetas que flotan sobre el plano ──
// En la computadora el panel, las tarjetas de arriba y la leyenda tapan parte del plano: la planta (o lo elegido)
// se centra y se escala en el resto. En el celular no flota nada encima.
function p3Libre() {
  const st = $('#p3stage'), R = st && st.getBoundingClientRect();
  if (!R || !R.width) return { w: 800, h: 500, dx: 0, dy: 0, W: 800, H: 500 };
  const ui = $('.p3-ui'), base = { w: R.width, h: R.height, dx: 0, dy: 0, W: R.width, H: R.height };
  if (!ui || getComputedStyle(ui).display === 'contents') return base;
  const caja = el => { if (!el || el.hidden) return null; const r = el.getBoundingClientRect(); return r.width > 4 && r.height > 4 ? r : null; };
  let t = R.top, b = R.bottom, l = R.left, r = R.right;
  const top = caja($('.p3-top')), kp = caja($('#p3kpis')), side = caja($('#p3side')), leg = caja($('#p3legend'));
  if (top) t = Math.max(t, top.bottom);
  if (kp) t = Math.max(t, kp.top + kp.height * 0.55);   // las tarjetas pueden tapar un poco el borde, como en un juego
  if (side) r = Math.min(r, side.left);
  if (leg) b = Math.min(b, R.bottom - leg.height * 0.45);
  const w = Math.max(160, r - l - 16), h = Math.max(140, b - t - 16);
  return { w, h, dx: (l + r) / 2 - (R.left + R.right) / 2, dy: (t + b) / 2 - (R.top + R.bottom) / 2, W: R.width, H: R.height };
}
// Lleva la cámara a f (de p3Encaje) con lo elegido en el centro del área libre.
function p3IrLibre(f, off, animar = true, zMin = 0) {
  const S = P3, T = S.T, L = p3Libre(), zoom = Math.min(S.controls.maxZoom, Math.max(S.controls.minZoom, zMin, f.zoom * Math.min(L.w / L.W, L.h / L.H)));
  const fwd = off.clone().negate().normalize(), right = new T.Vector3().crossVectors(fwd, S.cam.up).normalize(), up = new T.Vector3().crossVectors(right, fwd).normalize();
  const upp = (S.cam.right - S.cam.left) / zoom / L.W;   // metros por px con ese zoom
  const tgt = f.centro.clone().addScaledVector(right, -L.dx * upp).addScaledVector(up, L.dy * upp);
  if (Math.abs(fwd.y) > 1e-6) tgt.addScaledVector(fwd, -tgt.y / fwd.y);   // de vuelta al piso, sin mover lo que se ve
  const pos = tgt.clone().add(off);
  if (!animar) { S.cam.position.copy(pos); S.controls.target.copy(tgt); S.cam.zoom = zoom; S.cam.updateProjectionMatrix(); S.controls.update(); S.dirty = true; return; }
  p3Animar(pos, tgt, zoom);
}

// ───────────── tablero en modo planta (09 v5) ─────────────
// Con la pestaña abierta, el tablero de Google esconde su membrete (y con él el botón de modo oscuro): el
// botón de tema de esta página lo reemplaza.
window.addEventListener('message', e => {
  if (!e.data || e.data.type !== 'vspt-planta3d-modo' || e.source !== window.parent) return;
  p3.modoTablero = !!e.data.on;
  const t = $('#p3Tema'); if (t) t.hidden = !p3.modoTablero;
});

// ───────────── tema (lo decide el tablero) ─────────────
function applyTheme(dark) { document.body.classList.toggle('light', !dark); $('#btnTheme').textContent = dark ? 'Claro' : 'Oscuro'; if (P3) p3Tema(); if (P2) p2Tema(); if (D) p3Panel(); p5PMemo = null; }
window.addEventListener('message', e => { if (e.data && e.data.type === 'vspt-theme') applyTheme(!!e.data.dark); });
if (window.self === window.top) { $('#btnTheme').hidden = false; $('#btnTheme').onclick = () => applyTheme(document.body.classList.contains('light')); }
$('#btnReload').onclick = () => cargar();
window.addEventListener('beforeunload', e => { if (Object.keys(p3.mov).length) { e.preventDefault(); e.returnValue = ''; } });
(window.VSPT_API_READY || Promise.resolve()).then(() => { cargar(); cargarOpinona(); });
</script>
